# Сайт студии: Django за gunicorn, обработчик роликов, PostgreSQL и nginx.
# Настройки берутся из .env, образец лежит в .env.example.
#
# Сети:
#   edge: только nginx, через неё открыты порты наружу;
#   frontend: nginx и сайт, без выхода в интернет;
#   backend: сайт, обработчик роликов и база, без выхода в интернет.

name: keratin

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app: &app
  <<: *hardening
  env_file: .env
  environment:
    POSTGRES_HOST: db
    USE_X_REAL_IP: "True"
    MEDIA_ROOT: /app/media
    PRIVATE_MEDIA_ROOT: /app/private_media
    FILE_UPLOAD_TEMP_DIR: /app/private_media/tmp
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  volumes:
    - media:/app/media
    - private_media:/app/private_media

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keratin}
      POSTGRES_USER: ${POSTGRES_USER:-keratin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app
    build:
      context: .
      target: web
    image: keratin-web
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput
        && mkdir -p /app/private_media/tmp
        && exec gunicorn keratin.wsgi
        --bind 0.0.0.0:8000
        --workers ${GUNICORN_WORKERS:-3}
        --timeout 120
        --max-requests 1000
        --max-requests-jitter 100
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request as r;
          host = os.environ["ALLOWED_HOSTS"].split(",")[0].strip().lstrip(".");
          r.urlopen(r.Request("http://127.0.0.1:8000/healthz/",
          headers={"Host": host}), timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    build:
      context: .
      target: worker
    image: keratin-worker
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-1}"
          memory: 1536M
          pids: 256

  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.30-alpine
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx/${NGINX_CONF:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
      # Большие загрузки сначала пишутся сюда, поэтому не в память.
      - nginx_tmp:/tmp
    read_only: true
    cap_drop:
      - ALL
    networks:
      - edge
      - frontend

  # Выпуск и продление сертификата: deploy/get-certificate.sh
  # и deploy/renew-certificate.sh.
  certbot:
    image: certbot/certbot:v5.9.0
    profiles:
      - tools
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./deploy/certbot-hook.sh:/hook.sh:ro
    networks:
      - edge

networks:
  edge: {}
  frontend:
    internal: true
  backend:
    internal: true

volumes:
  pgdata:
  media:
  private_media:
  letsencrypt:
  certbot_www:
  nginx_tmp:
