# Первый запуск: nginx только подтверждает домен для Let's Encrypt.
# После выпуска сертификата в .env ставится NGINX_CONF=https.

server_tokens off;

server {
    listen 8080 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
