# Рабочий режим: HTTPS, сайт и загруженные файлы.
# Сертификат выпускает deploy/get-certificate.sh, копию для nginx
# кладёт deploy/certbot-hook.sh, поэтому путь не зависит от домена.

server_tokens off;

# Встроенный DNS Docker: адрес сайта узнаётся при запросе, поэтому nginx
# запускается, даже если контейнер с сайтом ещё не поднялся.
resolver 127.0.0.11 valid=10s ipv6=off;

# Лимиты на адрес клиента: общий и отдельный для отправки форм
# (вход в админку, сохранение, загрузка файлов).
limit_req_zone $binary_remote_addr zone=site:10m rate=20r/s;
map $request_method $form_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $form_client zone=forms:10m rate=30r/m;
limit_req_status 429;

server {
    listen 8080 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    http2 on;

    ssl_certificate /etc/letsencrypt/nginx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nginx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Один адрес сайта для поисковиков: с www перенаправляется на домен
    # без www (сертификат выпускается на оба).
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Ролик до VIDEO_MAX_UPLOAD_MB и запас на остальные поля формы.
    client_max_body_size 520m;

    # Загруженные фото и готовые ролики: отдаются только WebP и MP4,
    # остальное в папке недоступно. Имена файлов случайные и при замене
    # меняются, поэтому кешировать можно надолго.
    location ~ ^/media/(.+\.(?:webp|mp4))$ {
        alias /srv/media/$1;
        expires 30d;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location /media/ {
        return 404;
    }

    # Остальное, включая статику (её отдаёт WhiteNoise), идёт в Django.
    # Заголовки безопасности для страниц ставит сам Django.
    location / {
        limit_req zone=site burst=50 nodelay;
        limit_req zone=forms burst=10 nodelay;

        set $django http://web:8000;
        proxy_pass $django;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
