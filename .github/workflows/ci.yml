name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: keratin
          POSTGRES_USER: keratin
          POSTGRES_PASSWORD: keratin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keratin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: keratin
      POSTGRES_USER: keratin
      POSTGRES_PASSWORD: keratin
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ffmpeg for video tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Django checks
        working-directory: keratin
        env:
          DJANGO_SETTINGS_MODULE: keratin.settings_test
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Production static files
        working-directory: keratin
        env:
          SECRET_KEY: ci-only-secret-key
          STATIC_ROOT: ${{ runner.temp }}/staticfiles
        run: python manage.py collectstatic --noinput
      - name: Tests
        run: pytest --cov --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Settings for the smoke test
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^SECRET_KEY=$|SECRET_KEY=$(openssl rand -hex 32)|" \
            -e 's|^ALLOWED_HOSTS=.*|ALLOWED_HOSTS=localhost|' \
            -e 's|^CSRF_TRUSTED_ORIGINS=.*|CSRF_TRUSTED_ORIGINS=https://localhost:8443|' \
            -e 's|^ADMIN_URL=$|ADMIN_URL=studio-ci/|' \
            -e 's|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=ci-password|' \
            -e 's|^NGINX_CONF=.*|NGINX_CONF=https|' \
            -e 's|^HTTP_PORT=.*|HTTP_PORT=8080|' \
            -e 's|^HTTPS_PORT=.*|HTTPS_PORT=8443|' \
            -e 's|^WORKER_CPUS=.*|WORKER_CPUS=2|' \
            .env
      - name: Self-signed certificate through the certbot hook
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/privkey.pem" -out "$RUNNER_TEMP/fullchain.pem"
          docker volume create \
            --label com.docker.compose.project=keratin \
            --label com.docker.compose.volume=letsencrypt \
            keratin_letsencrypt
          docker run --rm --entrypoint sh -e RENEWED_LINEAGE=/certs \
            -v "$RUNNER_TEMP:/certs:ro" \
            -v keratin_letsencrypt:/etc/letsencrypt \
            -v "$PWD/deploy/certbot-hook.sh:/hook.sh:ro" \
            certbot/certbot:v5.9.0 /hook.sh
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Site works through nginx
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 301
          curl -fsSk https://localhost:8443/ > /dev/null
          curl -fsSk https://localhost:8443/price/ > /dev/null
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/media/x.txt)" = 404
          docker compose exec -T web python manage.py check --deploy --fail-level WARNING
      - name: Containers run without root
        run: |
          test "$(docker compose exec -T web id -u)" = 10001
          test "$(docker compose exec -T worker id -u)" = 10001
          test "$(docker compose exec -T nginx id -u)" = 101
      - name: Seed videos are transcoded by the worker
        run: |
          docker compose exec -T web python manage.py load_initial_content
          count='from studio.models import PortfolioVideo as V; print(V.objects.exclude(status__in=["ready", "failed"]).count())'
          for attempt in $(seq 120); do
            left=$(docker compose exec -T web python manage.py shell --no-imports -v 0 -c "$count")
            [ "$left" = 0 ] && break
            sleep 5
          done
          failed='from studio.models import PortfolioVideo as V; print(list(V.objects.filter(status="failed").values_list("title", "error")))'
          docker compose exec -T web python manage.py shell --no-imports -v 0 -c "$failed" | tee "$RUNNER_TEMP/failed.txt"
          grep -qx '\[\]' "$RUNNER_TEMP/failed.txt"
          test "$left" = 0
      - name: Videos are served with safe headers
        run: |
          video=$(curl -fsSk https://localhost:8443/ | grep -o '/media/portfolio/videos/[0-9a-f]*\.mp4' | head -n 1)
          test -n "$video"
          curl -fsSk -D "$RUNNER_TEMP/headers.txt" -o /dev/null "https://localhost:8443$video"
          grep -qi '^content-type: video/mp4' "$RUNNER_TEMP/headers.txt"
          grep -qi '^x-content-type-options: nosniff' "$RUNNER_TEMP/headers.txt"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
